name: PhononCharacters
options:
  bundleIdPrefix: com.sharath
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO

packages:
  ptts:
    url: https://github.com/gradium-ai/xn-ptts.git
    exactVersion: 0.6.0

targets:
  PhononCharacters:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Services
      - path: Features
      - path: Resources/llama
        type: folder
        buildPhase: resources
      - path: Resources/Characters
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharath.phononcharacters
        PRODUCT_NAME: Phonon Characters
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PhononCharacters.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: ptts
        product: ptts
